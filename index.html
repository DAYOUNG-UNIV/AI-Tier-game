<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어피니티 다이어그램 보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden; /* 보드 영역 넘어가는 스크롤 방지 */
            background-color: #f8fafc;
        }

        /* 화이트보드 격자 무늬 배경 */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
        }

        /* 포스트잇 기본 스타일 및 애니메이션 */
        .post-it {
            position: absolute;
            width: 280px;
            padding: 1rem;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
            cursor: grab;
            user-select: none;
            touch-action: none; /* 개별 포스트잇에서 스크롤 방지 */
            transition: transform 0.1s, box-shadow 0.2s;
            border-bottom-right-radius: 20px 15px;
            /* 종이 질감 느낌 약간의 그라데이션 */
            background-image: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
        }

        .post-it:active, .post-it.dragging {
            cursor: grabbing;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.25);
            /* CSS의 transform이 JS의 translate 위치값을 덮어쓰는 문제 해결을 위해 아래 라인 삭제 */
            z-index: 9999 !important; /* 드래그 시 항상 최상단 */
        }

        /* 캔버스 래퍼 영역 (스크롤 및 패닝) */
        #board {
            overflow: auto; /* 스크롤 허용 */
            cursor: grab; /* 바탕 영역 잡기 커서 */
        }
        #board:active {
            cursor: grabbing;
        }

        /* 하단 컨트롤 패널 숨김용 */
        .panel-transition {
            transition: transform 0.3s ease-in-out;
            transform-origin: top right;
        }
    </style>
</head>
<body class="w-screen h-screen relative text-gray-800">

    <!-- 좌측 상단 타이틀 (플로팅) -->
    <div class="ui-element absolute top-5 left-5 z-50 pointer-events-none">
        <h1 class="text-lg font-bold text-gray-800 bg-white/90 backdrop-blur-md px-4 py-2 rounded-xl shadow-md border border-gray-200 pointer-events-auto flex items-center gap-2">
            📌 FGI 어피니티 다이어그램 보드
        </h1>
    </div>

    <!-- 우측 상단 플로팅 메뉴 -->
    <div class="ui-element absolute top-5 right-5 z-50 flex flex-col items-end gap-2">
        <!-- 토글 버튼 -->
        <button onclick="toggleMenu()" class="p-3 bg-white/90 backdrop-blur-md hover:bg-gray-50 rounded-xl shadow-md border border-gray-200 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-300 flex items-center justify-center">
            <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- 메뉴 패널 (기본적으로 접혀있음) -->
        <div id="menu-panel" class="hidden flex-col gap-2 bg-white/90 backdrop-blur-md p-3 rounded-xl shadow-xl border border-gray-200 min-w-[170px] panel-transition">
            <button onclick="arrangeGrid(); toggleMenu();" class="w-full px-3 py-2.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors border border-gray-200 shadow-sm flex items-center gap-2.5">
                <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                전체 정렬
            </button>
            <button onclick="arrangeByGroupVertical(); toggleMenu();" class="w-full px-3 py-2.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors border border-gray-200 shadow-sm flex items-center gap-2.5">
                <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V5m6 14V5M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                인사이트 정렬 (세로)
            </button>
            <button onclick="arrangeByGroupHorizontal(); toggleMenu();" class="w-full px-3 py-2.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors border border-gray-200 shadow-sm flex items-center gap-2.5">
                <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                인사이트 정렬 (가로)
            </button>
            <hr class="border-gray-200 my-1">
            <button onclick="arrangeByOriginalGroupHorizontal(); toggleMenu();" class="w-full px-3 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-sm font-bold transition-colors border border-blue-200 shadow-sm flex items-center gap-2.5">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                원본 그룹 정렬 (가로)
            </button>
            <hr class="border-gray-200 my-1">
            <button onclick="arrangeRandom(); toggleMenu();" class="w-full px-3 py-2.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors border border-gray-200 shadow-sm flex items-center gap-2.5">
                <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                랜덤 흩뿌리기
            </button>
            <button onclick="undo(); toggleMenu();" class="w-full px-3 py-2.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors border border-gray-200 shadow-sm flex items-center gap-2.5" title="단축키: Ctrl+Z">
                <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                실행 취소
            </button>
            <button onclick="resetPositions(); toggleMenu();" class="w-full px-3 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-sm font-medium transition-colors border border-red-200 shadow-sm flex items-center gap-2.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                위치 초기화
            </button>
        </div>
    </div>

    <!-- 범례 (Legend) 좌측 하단 -->
    <div class="ui-element absolute bottom-6 left-6 bg-white/90 backdrop-blur-sm p-4 rounded-lg shadow-lg z-50 border border-gray-200">
        <h3 class="text-sm font-bold mb-3 border-b pb-1">인사이트 그룹 범례</h3>
        <div class="flex flex-col gap-2 text-xs">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-yellow-200 rounded-sm border border-yellow-300"></div>
                <span>Group 1: 도구에서 '필수 동료'로</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-pink-200 rounded-sm border border-pink-300"></div>
                <span>Group 2: 보이지 않는 비용 (검증/통제)</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-blue-200 rounded-sm border border-blue-300"></div>
                <span>Group 3: 주체성 위협과 인간화 딜레마</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-green-200 rounded-sm border border-green-300"></div>
                <span>Group 4: 이상적인 에이전트 설계</span>
            </div>
        </div>
    </div>

    <!-- 포스트잇들이 렌더링될 보드 영역 (무한 캔버스 느낌) -->
    <main id="board" class="w-full h-full relative overflow-auto">
        <!-- 5000px의 넓은 가상 캔버스 영역 -->
        <div id="canvas-area" class="w-[5000px] h-[5000px] bg-grid relative"></div>
    </main>

    <script>
        // 어피니티 다이어그램 데이터 (Markdown에서 파싱 + Original Group 1~14 할당)
        const postItsData = [
            // Group 1 (Yellow)
            { id: "14-A", originalGroup: 14, group: 1, speaker: "P2", text: "결국 획기적이고 이전에 없었던 아이디어 자체는 사람이 만들어야 한다고 봐요. AI는 그 인간의 아이디어를 바탕으로 수많은 절차를 대신 실행해 주는 도구일 때 가장 이상적입니다.", keyword: "아이디어는 인간의 몫, AI는 완벽한 실행 도구" },
            { id: "2-A", originalGroup: 2, group: 1, speaker: "P2", text: "저는 코딩을 모르는 분야니까 전적으로 의지해요. 물리적인 매뉴얼부터 코드 구현, 트러블 슈팅까지 다 해줘요.", keyword: "비전문 분야 코딩/개발" },

            { id: "2-E", originalGroup: 2, group: 1, speaker: "P1", text: "40개 모델링부터 텍스처, 리토폴로지 최적화까지 너무 오래 걸리는데, AI 없이 할 때랑 시간적으로 엄청 큰 차이가 납니다.", keyword: "대량 작업 시간 단축" },
            { id: "3-C", originalGroup: 3, group: 1, speaker: "P1", text: "하루에 걸리는 양을 얘가 거의 10분 만에 해주니까 당연히 쓰겠죠. 생산 확률이 훨씬 높습니다.", keyword: "압도적인 속도" },
            { id: "3-B", originalGroup: 3, group: 1, speaker: "P1", text: "기획 시간 비용이 큰데, 잘못됐을 때 다시 만들어야 하는 리스크를 AI가 감안해 줍니다.", keyword: "시행착오/리스크 감소" },

            { id: "2-C", originalGroup: 2, group: 1, speaker: "P2", text: "아이디어는 제 경험에서 부딪혀서 나오는 거고, AI한테는 '내가 이런 아이디어가 있어, 괜찮은 이유 갖다 붙여줘'라고 근거를 찾게 합니다.", keyword: "아이디어 근거/논리 보강" },
            { id: "1-A", originalGroup: 1, group: 1, speaker: "P1", text: "여러 AI에 똑같은 이미지를 넣어봤는데 Tripo가 내 결과물과 가장 비슷하고 가성비도 제일 좋아서 선택했어요. 얘가 없으면 올해 졸업 못합니다.", keyword: "결과물 일치도, 가성비, 필수 불가결" },

            { id: "1-B", originalGroup: 1, group: 1, speaker: "P1", text: "Meshy는 너무 디테일해서 오히려 영상용 같고 더러워 보이더라고요. 그래서 적정한 수준의 Tripo를 씁니다.", keyword: "적정 수준의 디테일" },

            { id: "3-D", originalGroup: 3, group: 1, speaker: "P3", text: "아이디어 기획, 글쓰기, 검색, 바이브 코딩, 이미지 생성 등 모든 걸 맡기고 있고, AI 없이 했을 때는 상상하기 힘들어요.", keyword: "전방위적 의존성" },

            { id: "4-B", originalGroup: 4, group: 2, speaker: "P3", text: "Gemini가 해결 못하고 '산으로 갈 때'가 있어요. 그럼 딱 느낌이 와서 싹 비우고 새로 시작하거나 GPT, Claude로 넘어갑니다.", keyword: "맥락 이탈 시 리셋/툴 전환" },
            { id: "2-D", originalGroup: 2, group: 2, speaker: "P3", text: "작업 맥락이 여러 개라 하나의 파일 안에서만 작업하는 느낌으로 분류하고 싶고, 자동화할 수 있는 부분에 활용합니다.", keyword: "작업 맥락 분류, 자동화" },

            { id: "7-A", originalGroup: 7, group: 2, speaker: "P2", text: "Claude는 대화량 초과로 끊길 거면 미리 말해주지 갑자기 전부 끝나버려서 UI상 대응하기가 불편했어요.", keyword: "대화량 제한 UI/UX 문제" },
            { id: "7-B", originalGroup: 7, group: 2, speaker: "P2", text: "ChatGPT는 한계가 와도 칭찬만 하고, 영상 AI는 거부 없이 무조건 생성해 버려요. 결과가 안 나오면 실망해서 아예 안 쓰게 되죠.", keyword: "맹목적 생성, 과장 광고 및 비용 낭비" },
            { id: "5-B", originalGroup: 5, group: 2, speaker: "P2", text: "아이디어는 무조건 내가 짜야 합니다. 얘는 내가 주문한 단서의 요건만 충족하는 답을 내놓을 뿐이에요.", keyword: "수동적인 답변" },
            { id: "5-A", originalGroup: 5, group: 2, speaker: "P2", text: "기획적인 아이디어에는 AI가 도움이 안 돼요. 허공 속의 현실감 없는 아이디어만 계속 내서 영감을 얻은 적이 없어요.", keyword: "창의성/현실감 부족" },

            { id: "12-C", originalGroup: 12, group: 4, speaker: "P3", text: "관심 있는 연구 주제를 다 읽고 번역해서 가르칠 준비가 완벽하게 되어 있는, '지도 교수님보다 더 업그레이드된 레벨'이 가장 이상적이에요.", keyword: "지도 교수급 어시스턴트" },
            { id: "13-B", originalGroup: 13, group: 4, speaker: "P2", text: "아이디어만 사람이 내면, 가장 어려운 검증 단계를 포함한 나머지 모든 연구 절차를 AI가 알아서 싹 다 처리해 주는 시스템이 있었으면 좋겠어요.", keyword: "연구 절차의 전면 자동화" },
            { id: "13-C", originalGroup: 13, group: 4, speaker: "P2", text: "비용과 시간이 너무 많이 드는 방대한 리서치 작업을, 인간이 할 수 없는 다른 차원의 기계적이고 획기적인 알고리즘으로 해결해 주길 바랍니다.", keyword: "초인적 데이터 처리 알고리즘" }
        ];

        // 그룹별 색상 매핑
        const groupColors = {
            1: "bg-yellow-200 border-yellow-300 text-yellow-900",
            2: "bg-pink-200 border-pink-300 text-pink-900",
            3: "bg-blue-200 border-blue-300 text-blue-900",
            4: "bg-green-200 border-green-300 text-green-900"
        };

        const insightGroupTitles = {
            1: "도구에서 '필수 동료'로",
            2: "보이지 않는 비용 (검증/통제)",
            3: "주체성 위협과 인간화 딜레마",
            4: "이상적인 에이전트 설계"
        };

        const originalGroupTitles = {
            1: "AI Tool Selection Criteria",
            2: "Specific AI Tool Applications",
            3: "Impact on Research Productivity",
            4: "AI Output Refinement and Verification",

            6: "Trust and Reliability in AI",
            7: "AI Output Quality & Usability Issues",
            8: "Ethical and Trust Concerns",
            9: "Loss of Human Agency and Originality",
            10: "AI's Non-human Characteristics",
            11: "AI Intervention Level and Autonomy",
            12: "AI as a Personalized Cognitive Extension",
            13: "Specific Desired AI Functions for Research",
            14: "AI's Role in Idea Generation"
        };

        const board = document.getElementById('board');
        const canvasArea = document.getElementById('canvas-area');
        let zIndexCounter = 10;
        let postItElements = [];
        let insightHeaderElements = []; // 인사이트 그룹 타이틀 엘리먼트 배열
        let originalHeaderElements = []; // 원본 그룹 타이틀 엘리먼트 배열
        
        // 정렬 모드 상태 ('vertical' | 'horizontal' | 'original_horizontal' | null)
        let groupSortDirection = null; 

        // 드래그 상태 관리 변수
        let activeItem = null;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        // 보드 패닝(스크롤) 관련 변수
        let isPanning = false;
        let panStartX, panStartY;
        let scrollLeftStart, scrollTopStart;

        // 실행 취소(Undo) 관련 상태 변수
        let historyStack = [];
        let dragInitialState = null;

        // 메뉴 토글 함수
        function toggleMenu() {
            const menuPanel = document.getElementById('menu-panel');
            if (menuPanel.classList.contains('hidden')) {
                menuPanel.classList.remove('hidden');
                menuPanel.classList.add('flex');
            } else {
                menuPanel.classList.add('hidden');
                menuPanel.classList.remove('flex');
            }
        }

        // 바탕을 클릭했을 때 열려있는 메뉴 닫기 (선택적)
        window.addEventListener('mousedown', (e) => {
            const menuPanel = document.getElementById('menu-panel');
            if (!menuPanel.classList.contains('hidden')) {
                // 클릭한 요소가 우측 상단 UI 래퍼가 아닐 때 닫음
                if (!e.target.closest('.ui-element')) {
                    toggleMenu();
                }
            }
        });

        // 현재 모든 포스트잇의 상태(x, y, 회전값)를 객체로 반환
        function getCurrentState() {
            const positions = {};
            postItElements.forEach(el => {
                positions[el.dataset.id] = {
                    x: parseFloat(el.dataset.x) || 0,
                    y: parseFloat(el.dataset.y) || 0,
                    rotation: parseFloat(el.dataset.rotation) || 0
                };
            });
            return { positions, groupSortDirection };
        }

        // 히스토리 스택에 상태 저장 (최대 50개)
        function saveStateToHistory(state) {
            historyStack.push(JSON.parse(JSON.stringify(state)));
            if (historyStack.length > 50) historyStack.shift(); 
        }

        // 실행 취소 동작
        function undo() {
            if (historyStack.length === 0) return; // 되돌릴 내역이 없으면 종료

            const previousState = historyStack.pop();
            
            postItElements.forEach(el => {
                // 이전 상태 객체 호환성 처리 (구버전 스토리지 대비)
                const pos = previousState.positions ? previousState.positions[el.dataset.id] : previousState[el.dataset.id];
                if (pos) {
                    el.dataset.x = pos.x;
                    el.dataset.y = pos.y;
                    el.dataset.rotation = pos.rotation;
                    el.style.transform = `translate(${pos.x}px, ${pos.y}px) rotate(${pos.rotation}deg)`;
                }
            });
            
            // 헤더 가시성 복구 (하위 호환성 체크)
            if (previousState.groupSortDirection !== undefined) {
                groupSortDirection = previousState.groupSortDirection;
            } else if (previousState.isGroupSortActive) {
                groupSortDirection = 'vertical';
            } else {
                groupSortDirection = null;
            }
            
            updateHeaderVisibility();
            savePositions(); // 되돌린 상태도 로컬 스토리지에 동기화
        }

        // 그룹 헤더 표시 업데이트 로직
        function updateHeaderVisibility() {
            // 인사이트 그룹(4개) 타이틀 업데이트
            insightHeaderElements.forEach((el, index) => {
                if (groupSortDirection === 'vertical') {
                    const paddingX = 40;
                    const colSpacing = 320;
                    const x = paddingX + (index * colSpacing);
                    const y = 90; // 상단 메뉴/타이틀과 겹치지 않도록 Y축 여백 조정
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    el.style.opacity = '1';
                } else if (groupSortDirection === 'horizontal') {
                    const paddingX = 40;
                    const rowSpacing = 320; // 가로 정렬 시 세로 간격
                    const x = paddingX;
                    const y = 90 + (index * rowSpacing);
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    el.style.opacity = '1';
                } else {
                    el.style.opacity = '0';
                }
            });

            // 원본 그룹(14개) 타이틀 업데이트
            originalHeaderElements.forEach((el, index) => {
                if (groupSortDirection === 'original_horizontal') {
                    const paddingX = 40;
                    const rowSpacing = 280; // 아이템이 많아 세로 간격을 살짝 줄임
                    const x = paddingX;
                    const y = 90 + (index * rowSpacing);
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    el.style.opacity = '1';
                } else {
                    el.style.opacity = '0';
                }
            });
        }

        // 포스트잇 생성 및 초기화 함수
        function createPostIts() {
            canvasArea.innerHTML = '';
            postItElements = [];
            insightHeaderElements = [];
            originalHeaderElements = [];

            // 로컬 스토리지에서 저장된 위치 데이터 불러오기
            const savedPositionsStr = localStorage.getItem('affinityBoardPositions');
            let savedPositions = {};
            if (savedPositionsStr) {
                try {
                    const parsed = JSON.parse(savedPositionsStr);
                    if (parsed.positions) {
                        savedPositions = parsed.positions;
                        if (parsed.groupSortDirection !== undefined) {
                            groupSortDirection = parsed.groupSortDirection;
                        } else if (parsed.isGroupSortActive) {
                            groupSortDirection = 'vertical'; // 기존 호환성
                        } else {
                            groupSortDirection = null;
                        }
                    } else {
                        savedPositions = parsed; // 하위 호환성 보장
                        groupSortDirection = null;
                    }
                } catch(e) {
                    console.error("로컬 스토리지 파싱 에러", e);
                }
            }

            // 1. 인사이트 그룹 헤더 엘리먼트 렌더링 (4개)
            for (let i = 1; i <= 4; i++) {
                const el = document.createElement('div');
                const borderColorClass = groupColors[i].split(' ')[1];
                el.className = `absolute w-[280px] p-3 rounded-xl border-2 bg-white/90 backdrop-blur-sm shadow-sm transition-all duration-300 pointer-events-none z-0 opacity-0 ${borderColorClass}`;
                el.innerHTML = `
                    <div class="text-[11px] font-bold text-gray-500 mb-0.5 tracking-wide">INSIGHT GROUP ${i}</div>
                    <div class="text-[15px] font-bold text-gray-800 leading-tight">${insightGroupTitles[i]}</div>
                `;
                canvasArea.appendChild(el);
                insightHeaderElements.push(el);
            }

            // 2. 원본 그룹 헤더 엘리먼트 렌더링 (14개)
            for (let i = 1; i <= 14; i++) {
                const el = document.createElement('div');
                el.className = `absolute w-[280px] p-3 rounded-xl border-2 bg-gray-100/90 backdrop-blur-sm shadow-sm transition-all duration-300 pointer-events-none z-0 opacity-0 border-gray-300`;
                el.innerHTML = `
                    <div class="text-[11px] font-bold text-gray-500 mb-0.5 tracking-wide">ORIGINAL GROUP ${i}</div>
                    <div class="text-[14px] font-bold text-gray-800 leading-tight">${originalGroupTitles[i]}</div>
                `;
                canvasArea.appendChild(el);
                originalHeaderElements.push(el);
            }

            postItsData.forEach((data, index) => {
                const el = document.createElement('div');
                const colors = groupColors[data.group];
                
                el.className = `post-it border ${colors}`;
                el.dataset.id = data.id; // 저장을 위해 ID 부여
                
                // 내부 HTML 구성 (키워드 힌트 + 발화 + 발언자)
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-2 border-b border-black/10 pb-1">
                        <div class="flex gap-1.5 items-center">
                            <span class="text-xs font-bold bg-black/5 px-1.5 py-0.5 rounded">[${data.id}]</span>
                            <span class="text-[10px] font-bold text-white bg-gray-700 px-1.5 py-0.5 rounded-full">${data.speaker}</span>
                        </div>
                        <span class="text-[10px] font-semibold opacity-70" title="원본 그룹: ${data.originalGroup}">G${data.group}</span>
                    </div>
                    <p class="text-sm leading-relaxed font-medium mb-3">"${data.text}"</p>
                    <div class="text-xs font-bold text-black/60 bg-white/40 px-2 py-1 rounded inline-block">
                        # ${data.keyword}
                    </div>
                `;

                // 이벤트 리스너 추가
                el.addEventListener('mousedown', dragStart);
                el.addEventListener('touchstart', dragStart, { passive: false });
                
                canvasArea.appendChild(el);
                postItElements.push(el);

                // 저장된 위치가 있으면 적용
                if (savedPositions[data.id]) {
                    const pos = savedPositions[data.id];
                    el.dataset.x = pos.x;
                    el.dataset.y = pos.y;
                    el.dataset.rotation = pos.rotation;
                    el.style.transform = `translate(${pos.x}px, ${pos.y}px) rotate(${pos.rotation}deg)`;
                }
            });

            // 초기 헤더 가시성 동기화
            updateHeaderVisibility();

            // 저장된 위치가 없으면 초기 그리드 정렬
            if (!savedPositionsStr) {
                arrangeGrid();
            }
        }

        // 현재 모든 포스트잇 위치를 로컬 스토리지에 저장
        function savePositions() {
            const positions = {};
            postItElements.forEach(el => {
                positions[el.dataset.id] = {
                    x: parseFloat(el.dataset.x) || 0,
                    y: parseFloat(el.dataset.y) || 0,
                    rotation: parseFloat(el.dataset.rotation) || 0
                };
            });
            const dataToSave = {
                positions: positions,
                groupSortDirection: groupSortDirection
            };
            localStorage.setItem('affinityBoardPositions', JSON.stringify(dataToSave));
        }

        // 로컬 스토리지 삭제 및 초기화
        function resetPositions() {
            if(confirm('모든 포스트잇 위치를 초기화하시겠습니까?')) {
                saveStateToHistory(getCurrentState()); // 초기화 직전 상태 저장
                localStorage.removeItem('affinityBoardPositions');
                arrangeGrid(true); // 내부에서 중복 저장 안 함
            }
        }

        // 그리드 형태로 깔끔하게 정렬
        function arrangeGrid(skipHistory = false) {
            if (!skipHistory) saveStateToHistory(getCurrentState()); // 정렬 직전 상태 저장

            groupSortDirection = null; // 그리드 정렬 시 타이틀 숨김
            updateHeaderVisibility();

            const paddingX = 40;
            const paddingY = 120; // 상단 UI 공간 확보
            const postItWidth = 290; // width + margin
            const postItHeight = 220;
            
            // 현재 브라우저 창 너비 기준으로 열 개수 계산 (너무 넓게 퍼지지 않도록)
            const viewportWidth = window.innerWidth;
            const columns = Math.max(3, Math.floor((viewportWidth - paddingX * 2) / postItWidth));
            
            // 포스트잇들을 원래 데이터 순서(또는 ID 등)로 다시 정렬하여 배치 (랜덤하게 섞였을 수 있으므로)
            let sortedElements = [...postItElements].sort((a, b) => {
                const groupA = postItsData[postItElements.indexOf(a)].group;
                const groupB = postItsData[postItElements.indexOf(b)].group;
                return groupA - groupB;
            });

            sortedElements.forEach((el, index) => {
                const col = index % columns;
                const row = Math.floor(index / columns);
                
                const x = paddingX + (col * postItWidth);
                const y = paddingY + (row * postItHeight);
                
                // 약간의 랜덤 각도를 주어 자연스럽게 (그리드일때는 약하게)
                const rotation = (Math.random() - 0.5) * 4; 
                
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                
                // xOffset, yOffset 초기화 (드래그 시 튀는 현상 방지)
                el.dataset.x = x;
                el.dataset.y = y;
                el.dataset.rotation = rotation;
            });
            savePositions(); // 정렬 후 저장
        }

        // 인사이트 그룹별로 좌우 분리(컬럼) 정렬 (세로)
        function arrangeByGroupVertical(skipHistory = false) {
            if (!skipHistory) saveStateToHistory(getCurrentState()); // 정렬 직전 상태 저장

            groupSortDirection = 'vertical'; // 세로 그룹 정렬 시 타이틀 노출
            updateHeaderVisibility();

            const paddingX = 40;
            const paddingY = 180; // 타이틀 표시 공간 확보를 위해 내림
            const colSpacing = 320; // 그룹 간 좌우 간격
            const postItHeight = 220;
            
            // 각 그룹별로 몇 번째 아이템인지 카운트하기 위한 객체
            let groupCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };

            postItElements.forEach(el => {
                const dataId = el.dataset.id;
                const data = postItsData.find(d => d.id === dataId);
                const groupNum = data ? data.group : 1;
                
                const col = groupNum - 1; // 0, 1, 2, 3
                const row = groupCounts[groupNum];
                
                const x = paddingX + (col * colSpacing);
                const y = paddingY + (row * postItHeight);
                
                const rotation = (Math.random() - 0.5) * 4; 
                
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                
                el.dataset.x = x;
                el.dataset.y = y;
                el.dataset.rotation = rotation;

                groupCounts[groupNum]++;
            });
            savePositions();
        }

        // 인사이트 그룹별로 상하 분리(로우) 정렬 (가로)
        function arrangeByGroupHorizontal(skipHistory = false) {
            if (!skipHistory) saveStateToHistory(getCurrentState()); // 정렬 직전 상태 저장

            groupSortDirection = 'horizontal'; // 가로 그룹 정렬 시 타이틀 노출
            updateHeaderVisibility();

            const paddingX = 40;
            const rowSpacing = 320; // 각 그룹별 세로 간격
            const colSpacing = 320; // 그룹 내 포스트잇들의 가로 간격
            
            // 각 그룹별로 몇 번째 아이템인지 카운트하기 위한 객체
            let groupCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };

            postItElements.forEach(el => {
                const dataId = el.dataset.id;
                const data = postItsData.find(d => d.id === dataId);
                const groupNum = data ? data.group : 1;
                
                const row = groupNum - 1; // 0, 1, 2, 3
                const col = groupCounts[groupNum]; // 0, 1, 2, 3...
                
                // 가로 정렬의 경우 타이틀 우측으로 포스트잇이 나열됨
                // 타이틀의 width가 280px이므로 첫 번째 포스트잇은 280 + 여백 만큼 우측에서 시작
                const x = paddingX + 320 + (col * colSpacing); 
                const y = 90 + (row * rowSpacing); // 타이틀 Y값과 동일 선상에 배치
                
                const rotation = (Math.random() - 0.5) * 4; 
                
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                
                el.dataset.x = x;
                el.dataset.y = y;
                el.dataset.rotation = rotation;

                groupCounts[groupNum]++;
            });
            savePositions();
        }

        // 원본 그룹(1~14) 기준으로 상하 분리 정렬 (가로)
        function arrangeByOriginalGroupHorizontal(skipHistory = false) {
            if (!skipHistory) saveStateToHistory(getCurrentState()); 

            groupSortDirection = 'original_horizontal'; // 원본 가로 정렬
            updateHeaderVisibility();

            const paddingX = 40;
            const rowSpacing = 280; // 14개나 되므로 세로 간격을 약간 좁힘
            const colSpacing = 320; // 그룹 내 포스트잇들의 가로 간격
            
            // 1~14 그룹 아이템 카운팅 객체 초기화
            let groupCounts = {};
            for(let i = 1; i <= 14; i++) groupCounts[i] = 0;

            postItElements.forEach(el => {
                const dataId = el.dataset.id;
                const data = postItsData.find(d => d.id === dataId);
                const origGroupNum = data ? data.originalGroup : 1;
                
                const row = origGroupNum - 1; // 0 ~ 13
                const col = groupCounts[origGroupNum];
                
                const x = paddingX + 320 + (col * colSpacing); 
                const y = 90 + (row * rowSpacing); 
                
                const rotation = (Math.random() - 0.5) * 4; 
                
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                
                el.dataset.x = x;
                el.dataset.y = y;
                el.dataset.rotation = rotation;

                groupCounts[origGroupNum]++;
            });
            savePositions();
        }

        // 보드 곳곳에 흩뿌리기
        function arrangeRandom() {
            saveStateToHistory(getCurrentState()); // 흩뿌리기 직전 상태 저장

            groupSortDirection = null; // 흩뿌리기 시 타이틀 숨김
            updateHeaderVisibility();

            const maxX = 4500; // 5000px 캔버스 기준
            const maxY = 4500;
            const minY = 100;

            postItElements.forEach((el) => {
                const x = Math.max(20, Math.floor(Math.random() * maxX));
                const y = Math.max(minY, Math.floor(Math.random() * maxY));
                const rotation = (Math.random() - 0.5) * 15; // 랜덤 각도 크게
                
                el.style.transition = 'transform 0.5s ease-out';
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                
                el.dataset.x = x;
                el.dataset.y = y;
                el.dataset.rotation = rotation;
                // 트랜지션 완료 후 드래그를 위해 트랜지션 제거 및 저장
                setTimeout(() => {
                    el.style.transition = 'transform 0.1s, box-shadow 0.2s';
                    savePositions();
                }, 500);
            });
        }

        /* --- 드래그 앤 드롭 로직 --- */
        function dragStart(e) {
            // 터치 이벤트인지 마우스 이벤트인지 판별
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX;
                initialY = e.touches[0].clientY;
            } else {
                initialX = e.clientX;
                initialY = e.clientY;
            }

            activeItem = e.target.closest('.post-it');

            if (activeItem) {
                e.stopPropagation(); // 포스트잇 드래그 시 캔버스 패닝 동작 방지

                dragInitialState = getCurrentState(); // 드래그 시작 시점의 전체 상태 임시 저장

                // 맨 위로 올리기
                zIndexCounter++;
                activeItem.style.zIndex = zIndexCounter;
                activeItem.classList.add('dragging');

                // 현재 요소의 위치(transform 값) 가져오기
                const x = parseFloat(activeItem.dataset.x) || 0;
                const y = parseFloat(activeItem.dataset.y) || 0;
                
                xOffset = x;
                yOffset = y;
                
                currentX = 0;
                currentY = 0;
                
                // 애니메이션 트랜지션 끄기 (드래그 중 반응속도 향상)
                activeItem.style.transition = 'none';

                // 클릭 시 튀는 것을 방지하기 위해 드래그 시작 시점의 위치로 즉시 고정 (CSS에서 !important 지운 후 여기서 정상동작함)
                activeItem.style.transform = `translate(${xOffset}px, ${yOffset}px) scale(1.02) rotate(0deg)`;

                // 이벤트 등록
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);
            }
        }

        function drag(e) {
            if (activeItem) {
                e.preventDefault(); // 스크롤 등 기본 동작 방지
            
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                const newX = xOffset + currentX;
                const newY = yOffset + currentY;
                
                // 드래그 중 각도 초기화 (0도)
                activeItem.style.transform = `translate(${newX}px, ${newY}px) scale(1.02) rotate(0deg)`;
            }
        }

        function dragEnd(e) {
            if (activeItem) {
                activeItem.classList.remove('dragging');
                
                // 최종 위치를 데이터셋에 저장
                activeItem.dataset.x = xOffset + currentX;
                activeItem.dataset.y = yOffset + currentY;
                
                // 원래 갖고 있던 회전값(rotation) 복구
                const rotation = activeItem.dataset.rotation || 0;
                activeItem.style.transform = `translate(${activeItem.dataset.x}px, ${activeItem.dataset.y}px) rotate(${rotation}deg)`;
                
                // 트랜지션 원상복구
                activeItem.style.transition = 'transform 0.1s, box-shadow 0.2s';
                
                // 위치가 실제로 변경되었을 때만 히스토리(Undo) 추가
                if (dragInitialState) {
                    const currentState = getCurrentState();
                    if (JSON.stringify(dragInitialState.positions[activeItem.dataset.id]) !== JSON.stringify(currentState.positions[activeItem.dataset.id])) {
                        saveStateToHistory(dragInitialState);
                    }
                    dragInitialState = null;
                }

                // 드래그가 끝났을 때 위치 저장
                savePositions();

                activeItem = null;
                initialX = currentX;
                initialY = currentY;

                // 이벤트 해제
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchend', dragEnd);
            }
        }

        /* --- 캔버스 패닝(화면 이동) 로직 --- */
        board.addEventListener('mousedown', (e) => {
            // 포스트잇이나 상단 UI 영역 클릭 시 패닝 무시
            if (e.target.closest('.post-it') || e.target.closest('.ui-element')) return;
            
            isPanning = true;
            panStartX = e.clientX;
            panStartY = e.clientY;
            scrollLeftStart = board.scrollLeft;
            scrollTopStart = board.scrollTop;
        });

        // 모바일 터치 패닝 지원
        board.addEventListener('touchstart', (e) => {
            if (e.target.closest('.post-it') || e.target.closest('.ui-element')) return;
            if (e.touches.length === 1) {
                isPanning = true;
                panStartX = e.touches[0].clientX;
                panStartY = e.touches[0].clientY;
                scrollLeftStart = board.scrollLeft;
                scrollTopStart = board.scrollTop;
            }
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            const dx = e.clientX - panStartX;
            const dy = e.clientY - panStartY;
            board.scrollLeft = scrollLeftStart - dx;
            board.scrollTop = scrollTopStart - dy;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isPanning) return;
            const dx = e.touches[0].clientX - panStartX;
            const dy = e.touches[0].clientY - panStartY;
            board.scrollLeft = scrollLeftStart - dx;
            board.scrollTop = scrollTopStart - dy;
        }, { passive: true });

        window.addEventListener('mouseup', () => { isPanning = false; });
        window.addEventListener('touchend', () => { isPanning = false; });

        // Ctrl+Z (또는 Cmd+Z) 단축키 지원
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault(); // 브라우저 기본 되돌리기 방지
                undo();
            }
        });

        // 초기화 실행
        window.addEventListener('DOMContentLoaded', createPostIts);
        
        // 윈도우 리사이즈 시 화면 바깥으로 나가지 않게 하기 위해 간단한 그리드 재정렬
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                // 리사이즈 될 때는 흩어둔게 망가지면 안되니 자동 정렬은 주석처리. 
                // arrangeGrid(); 
            }, 250);
        });

    </script>
